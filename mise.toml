[tools]
dotnet = "10"
node = "lts"
sqlite = "latest"

[tasks.build]
description = "Build the .NET solution"
run = "dotnet build Craftiger.slnx"

[tasks.test]
description = "Run all tests"
run = "dotnet test Craftiger.slnx"

[tasks.builder]
description = "Run the artifact builder (NESQL dump in, planner artifacts out)"
run = "dotnet run --project src/Craftiger.Builder"

[tasks.api]
description = "Run the API"
run = "dotnet run --project src/Craftiger.Api"
# dotnet run starts the app in the project directory, so point it back at the repo's artifacts.
env = { ApiOptions__ArtifactsDir = "{{config_root}}/artifacts" }

[tasks.web]
description = "Run the web dev server"
dir = "web"
run = "npm run dev"
