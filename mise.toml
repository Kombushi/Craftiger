[tools]
dotnet = "10"
node = "lts"
sqlite = "latest"

[tasks.build]
description = "Build the .NET solution"
run = "dotnet build Craftiger.slnx"

[tasks.test]
description = "Run all tests"
run = "dotnet test Craftiger.slnx"

[tasks.builder]
description = "Run the artifact builder (NESQL dump in, planner artifacts out)"
run = "dotnet run --project src/Craftiger.Builder"

[tasks."dump:convert"]
description = "Convert an HSQLDB NESQL export to SQLite (args: <nesql-repository-dir> <output.sqlite>)"
run = "tools/dump-convert/convert.sh"

[tasks.api]
description = "Run the API"
run = "dotnet run --project src/Craftiger.Api"
# dotnet run starts the app in the project directory, so point it back at the repo's artifacts.
env = { ApiOptions__ArtifactsDir = "{{config_root}}/artifacts" }

[tasks.valkey]
description = "Start the local Valkey the API needs (docker compose)"
run = "docker compose up -d valkey"

[tasks.web]
description = "Run the web dev server"
dir = "web"
run = "npm run dev"

# Image coordinates shared by every docker task; the tag is passed per call via TAG.
[env]
CRAFTIGER_API_IMAGE = "ghcr.io/kombushi/craftiger-api"
CRAFTIGER_WEB_IMAGE = "ghcr.io/kombushi/craftiger-web"

[tasks."docker:login"]
description = "Log docker in to GHCR with the gh CLI token"
run = "gh auth token | docker login ghcr.io -u Kombushi --password-stdin"

[tasks."docker:build"]
description = "Build both container images"
depends = ["docker:build:api", "docker:build:web"]

[tasks."docker:build:api"]
description = "Build the API image (planner artifacts baked in)"
run = 'docker build -f src/Craftiger.Api/Dockerfile -t "${CRAFTIGER_API_IMAGE}:${TAG:?set TAG to the image version}" .'

[tasks."docker:build:web"]
description = "Build the web image"
dir = "web"
run = 'docker build -t "${CRAFTIGER_WEB_IMAGE}:${TAG:?set TAG to the image version}" .'

[tasks."docker:push"]
description = "Push both container images to GHCR"
depends = ["docker:push:api", "docker:push:web"]

[tasks."docker:push:api"]
description = "Push the API image"
run = 'docker push "${CRAFTIGER_API_IMAGE}:${TAG:?set TAG to the image version}"'

[tasks."docker:push:web"]
description = "Push the web image"
run = 'docker push "${CRAFTIGER_WEB_IMAGE}:${TAG:?set TAG to the image version}"'
